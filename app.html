<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt & Credit Tracker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7f6;
        margin: 0;
        padding: 0;
    }

    /* SPLASH SCREEN */
    #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #2e86de, #1b4f72);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff;
        z-index: 9999;
        transition: opacity 0.6s ease;
    }

    #splash.hidden {
        opacity: 0;
        pointer-events: none;
    }

    #splash h1 {
        font-size: 2.2em;
        margin: 0;
    }

    #splash p {
        margin-top: 10px;
        opacity: 0.9;
        font-size: 1.1em;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .summary {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }

    .summary div {
        background: #f0f0f0;
        padding: 20px;
        border-radius: 10px;
        width: 40%;
        text-align: center;
        font-size: 1.2em;
    }

    .summary span {
        display: block;
        font-size: 1.5em;
        margin-top: 10px;
        color: #2e86de;
    }

    input, select, button {
        padding: 10px;
        margin: 5px 0;
        width: 100%;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 1em;
    }

    button {
        background: #2e86de;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b4f72;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
    }

    th {
        background: #2e86de;
        color: #fff;
    }

    .debt { color: red; }
    .credit { color: green; }

    .action-btn {
        width: auto;
        padding: 6px 10px;
        margin-right: 5px;
    }

    .edit-input {
        width: 100%;
        padding: 5px;
    }

    footer {
        text-align: center;
        margin: 25px 0 10px;
        font-size: 0.9em;
        color: #555;
    }
</style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash">
    <h1>Debt & Credit Tracker</h1>
    <p>Loading your finances…</p>
</div>

<div class="container">
    <h1>Debt & Credit Tracker</h1>

    <div>
        <select id="month">
            <option value="01">January</option><option value="02">February</option>
            <option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option>
            <option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
        </select>
        <select id="year"></select>
        <button onclick="filterMonth()">Show Month</button>
    </div>

    <div class="summary">
        <div>Total Debt <span id="totalDebt">0</span></div>
        <div>Total Credit <span id="totalCredit">0</span></div>
    </div>

    <div>
        <input id="name" placeholder="Name / Description">
        <input id="amount" type="number" placeholder="Amount">
        <select id="type">
            <option value="debt">Debt</option>
            <option value="credit">Credit</option>
        </select>
        <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="transactionList"></tbody>
    </table>

    <div>
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="exportPDF()">Export PDF</button>
    </div>

    <footer>
        Design & Developed by <strong>Intisar Muhib</strong>😊
    </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
let editRow = null;

/* SPLASH HIDE */
window.onload = () => {
    setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
    }, 1200);
};

// Populate year dropdown
const yearSelect = document.getElementById('year');
const currentYear = new Date().getFullYear();
for (let i = currentYear; i >= currentYear - 10; i--) {
    yearSelect.add(new Option(i, i));
}

function addTransaction() {
    const name = document.getElementById('name').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;

    if (!name || amount <= 0) {
        alert('Invalid input');
        return;
    }

    transactions.push({
        name, amount, type,
        date: new Date().toISOString().split('T')[0]
    });

    save();
    document.getElementById('name').value = '';
    document.getElementById('amount').value = '';
}

function save() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
    updateDisplay();
}

function updateDisplay(list = transactions) {
    const tbody = document.getElementById('transactionList');
    tbody.innerHTML = '';

    let debt = 0, credit = 0;

    list.forEach((t, i) => {
        t.type === 'debt' ? debt += t.amount : credit += t.amount;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${t.name}</td>
            <td>${t.amount}</td>
            <td class="${t.type}">${t.type}</td>
            <td>${t.date}</td>
            <td>
                <button class="action-btn" onclick="startEdit(${i})">Edit</button>
                <button class="action-btn" onclick="confirmDelete(${i})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    totalDebt.textContent = debt;
    totalCredit.textContent = credit;
}

function startEdit(i) {
    if (editRow !== null) return;
    editRow = i;
    const t = transactions[i];
    const row = transactionList.children[i];

    row.innerHTML = `
        <td><input class="edit-input" value="${t.name}"></td>
        <td><input class="edit-input" type="number" value="${t.amount}"></td>
        <td>
            <select class="edit-input">
                <option value="debt" ${t.type === 'debt' ? 'selected' : ''}>Debt</option>
                <option value="credit" ${t.type === 'credit' ? 'selected' : ''}>Credit</option>
            </select>
        </td>
        <td>${t.date}</td>
        <td>
            <button class="action-btn" onclick="saveEdit(${i})">Save</button>
            <button class="action-btn" onclick="cancelEdit()">Cancel</button>
        </td>
    `;
}

function saveEdit(i) {
    const row = transactionList.children[i];
    const inputs = row.querySelectorAll('input, select');
    transactions[i].name = inputs[0].value;
    transactions[i].amount = parseFloat(inputs[1].value);
    transactions[i].type = inputs[2].value;
    editRow = null;
    save();
}

function cancelEdit() {
    editRow = null;
    updateDisplay();
}

function confirmDelete(i) {
    if (confirm('Are you sure you want to delete this transaction?')) {
        transactions.splice(i, 1);
        save();
    }
}

function filterMonth() {
    const m = month.value;
    const y = year.value;
    updateDisplay(transactions.filter(t => t.date.startsWith(`${y}-${m}`)));
}

function exportCSV() {
    let csv = 'Name,Amount,Type,Date\n';
    transactions.forEach(t => csv += `${t.name},${t.amount},${t.type},${t.date}\n`);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv]));
    a.download = 'transactions.csv';
    a.click();
}

function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 10;
    doc.text('Debt & Credit Report', 10, y);
    y += 10;
    transactions.forEach(t => {
        doc.text(`${t.date} | ${t.name} | ${t.type} | ${t.amount}`, 10, y);
        y += 8;
    });
    doc.save('transactions.pdf');
}

updateDisplay();
</script>

</body>
</html>
