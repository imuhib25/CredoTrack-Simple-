<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debt & Credit Tracker</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7f6;
        margin: 0;
        padding: 0;
    }

    /* SPLASH SCREEN */
    #splash {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #2e86de, #1b4f72);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #fff;
        z-index: 9999;
        transition: opacity 0.6s ease;
    }

    #splash.hidden {
        opacity: 0;
        pointer-events: none;
    }

    #splash h1 {
        font-size: 2.2em;
        margin: 0;
    }

    #splash p {
        margin-top: 10px;
        opacity: 0.9;
        font-size: 1.1em;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: #fff;
        padding: 20px 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #333;
    }

    .summary {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }

    .summary div {
        background: #f0f0f0;
        padding: 20px;
        border-radius: 10px;
        width: 40%;
        text-align: center;
        font-size: 1.2em;
    }

    .summary span {
        display: block;
        font-size: 1.5em;
        margin-top: 10px;
        color: #2e86de;
    }

    input, select, button {
        padding: 10px;
        margin: 5px 0;
        width: 100%;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 1em;
        box-sizing: border-box;
    }

    button {
        background: #2e86de;
        color: #fff;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #1b4f72;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
    }

    th {
        background: #2e86de;
        color: #fff;
    }

    .debt { color: #e74c3c; font-weight: bold; }
    .credit { color: #2ecc71; font-weight: bold; }

    .action-btn {
        width: auto;
        padding: 6px 10px;
        margin-right: 5px;
    }

    .edit-input {
        width: 100%;
        padding: 5px;
    }

    .export-btns {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    footer {
        text-align: center;
        margin: 25px 0 10px;
        font-size: 0.9em;
        color: #555;
    }
</style>
</head>

<body>

<div id="splash">
    <h1>Debt & Credit Tracker</h1>
    <p>Loading your finances…</p>
</div>

<div class="container">
    <h1>Debt & Credit Tracker</h1>

    <div>
        <select id="month">
            <option value="01">January</option><option value="02">February</option>
            <option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option>
            <option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
        </select>
        <select id="year"></select>
        <button onclick="filterMonth()">Show Month</button>
    </div>

    <div class="summary">
        <div>Total Debt <span id="totalDebt">0</span></div>
        <div>Total Credit <span id="totalCredit">0</span></div>
    </div>

    <div>
        <input id="name" placeholder="Name / Description">
        <input id="amount" type="number" placeholder="Amount">
        <select id="type">
            <option value="debt">Debt</option>
            <option value="credit">Credit</option>
        </select>
        <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="transactionList"></tbody>
    </table>

    <div class="export-btns">
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="exportPDF()">Export PDF</button>
        <button onclick="document.getElementById('pdfImport').click()">Import PDF</button>
        <input id="pdfImport" type="file" accept=".pdf,application/pdf" style="display:none" onchange="importPDF(event)">
    </div>
    <div id="importStatus" style="margin-top:10px;text-align:center;font-size:0.9em;color:#555;"></div>

    <footer>
        Design & Developed by <strong>Intisar Muhib</strong>😊
    </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>

<script>
let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
let editRow = null;

/* SPLASH HIDE */
window.onload = () => {
    setTimeout(() => {
        document.getElementById('splash').classList.add('hidden');
    }, 1200);
};

// Populate year dropdown
const yearSelect = document.getElementById('year');
const currentYear = new Date().getFullYear();
for (let i = currentYear; i >= currentYear - 10; i--) {
    yearSelect.add(new Option(i, i));
}

function addTransaction() {
    const name = document.getElementById('name').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;

    if (!name || isNaN(amount) || amount <= 0) {
        alert('Invalid input. Please enter a valid description and positive amount.');
        return;
    }

    transactions.push({
        name, amount, type,
        date: new Date().toISOString().split('T')[0]
    });

    save();
    document.getElementById('name').value = '';
    document.getElementById('amount').value = '';
}

function save() {
    localStorage.setItem('transactions', JSON.stringify(transactions));
    updateDisplay();
}

function updateDisplay(list = transactions) {
    const tbody = document.getElementById('transactionList');
    tbody.innerHTML = '';

    let debt = 0, credit = 0;

    list.forEach((t, i) => {
        t.type === 'debt' ? debt += Number(t.amount) : credit += Number(t.amount);

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${t.name}</td>
            <td>$${Number(t.amount).toFixed(2)}</td>
            <td class="${t.type}">${t.type.toUpperCase()}</td>
            <td>${t.date}</td>
            <td>
                <button class="action-btn" onclick="startEdit(${i})">Edit</button>
                <button class="action-btn" onclick="confirmDelete(${i})">Delete</button>
            </td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById('totalDebt').textContent = `$${debt.toFixed(2)}`;
    document.getElementById('totalCredit').textContent = `$${credit.toFixed(2)}`;
}

function startEdit(i) {
    if (editRow !== null) return;
    editRow = i;
    const t = transactions[i];
    const tbody = document.getElementById('transactionList');
    const row = tbody.children[i];

    row.innerHTML = `
        <td><input class="edit-input" value="${t.name}"></td>
        <td><input class="edit-input" type="number" value="${t.amount}"></td>
        <td>
            <select class="edit-input">
                <option value="debt" ${t.type === 'debt' ? 'selected' : ''}>Debt</option>
                <option value="credit" ${t.type === 'credit' ? 'selected' : ''}>Credit</option>
            </select>
        </td>
        <td>${t.date}</td>
        <td>
            <button class="action-btn" onclick="saveEdit(${i})">Save</button>
            <button class="action-btn" onclick="cancelEdit()">Cancel</button>
        </td>
    `;
}

function saveEdit(i) {
    const tbody = document.getElementById('transactionList');
    const row = tbody.children[i];
    const inputs = row.querySelectorAll('input, select');
    
    const name = inputs[0].value.trim();
    const amount = parseFloat(inputs[1].value);
    
    if (!name || isNaN(amount) || amount <= 0) {
        alert('Invalid input');
        return;
    }

    transactions[i].name = name;
    transactions[i].amount = amount;
    transactions[i].type = inputs[2].value;
    editRow = null;
    save();
}

function cancelEdit() {
    editRow = null;
    updateDisplay();
}

function confirmDelete(i) {
    if (confirm('Are you sure you want to delete this transaction?')) {
        transactions.splice(i, 1);
        save();
    }
}

function filterMonth() {
    const m = document.getElementById('month').value;
    const y = document.getElementById('year').value;
    updateDisplay(transactions.filter(t => t.date.startsWith(`${y}-${m}`)));
}

// Import transactions from a PDF
async function importPDF(event) {
    const file = event.target.files[0];
    const status = document.getElementById('importStatus');

    if (!file) return;

    status.textContent = 'Reading PDF...';

    try {
        // PDF.js is loaded as an ES module. Dynamically import it so the
        // rest of the application continues to work normally.
        const pdfjsLib = await import(
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs'
        );

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

        let allItems = [];

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
            const page = await pdf.getPage(pageNumber);
            const content = await page.getTextContent();

            // Keep x/y positions so table rows can be reconstructed.
            const items = content.items
                .filter(item => item.str && item.str.trim())
                .map(item => ({
                    text: item.str.trim(),
                    x: item.transform[4],
                    y: item.transform[5]
                }));

            allItems.push(...items);
        }

        const imported = parsePDFTransactions(allItems);

        if (!imported.length) {
            throw new Error(
                'No transaction rows were found. The PDF should contain rows with Date, Name/Description, Type (Debt/Credit), and Amount.'
            );
        }

        const shouldMerge = confirm(
            `Found ${imported.length} transaction(s) in the PDF.\n\n` +
            'OK = Add them to your existing transactions\n' +
            'Cancel = Replace your existing transactions'
        );

        transactions = shouldMerge ? transactions.concat(imported) : imported;

        save();
        status.textContent =
            `Successfully imported ${imported.length} transaction(s).`;

    } catch (error) {
        console.error('PDF import error:', error);
        status.textContent = 'PDF import failed.';
        alert('Could not import the PDF.\\n\\n' + error.message);
    } finally {
        // Allow importing the same PDF again.
        event.target.value = '';
    }
}

function parsePDFTransactions(items) {
    const rows = [];

    // Group text items by their vertical position.
    const sorted = [...items].sort((a, b) => {
        if (Math.abs(a.y - b.y) > 3) return b.y - a.y;
        return a.x - b.x;
    });

    const grouped = [];

    sorted.forEach(item => {
        let row = grouped.find(r => Math.abs(r.y - item.y) <= 3);

        if (!row) {
            row = { y: item.y, items: [] };
            grouped.push(row);
        }

        row.items.push(item);
    });

    grouped.sort((a, b) => b.y - a.y);

    grouped.forEach(row => {
        row.items.sort((a, b) => a.x - b.x);

        const text = row.items
            .map(item => item.text)
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();

        // Expected table row:
        // YYYY-MM-DD | Description | DEBT/CREDIT | $123.45
        const match = text.match(
            /(\d{4}-\d{2}-\d{2})\s+(.+?)\s+(DEBT|CREDIT)\s+\$?\s*([\d,]+(?:\.\d{1,2})?)/i
        );

        if (!match) return;

        const date = match[1];
        const name = match[2].trim();
        const type = match[3].toLowerCase();
        const amount = parseFloat(match[4].replace(/,/g, ''));

        if (
            name &&
            (type === 'debt' || type === 'credit') &&
            Number.isFinite(amount) &&
            amount > 0
        ) {
            rows.push({ name, amount, type, date });
        }
    });

    return rows;
}

function exportCSV() {
    let csv = 'Name,Amount,Type,Date\n';
    transactions.forEach(t => csv += `"${t.name}",${t.amount},${t.type},${t.date}\n`);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = 'transactions.csv';
    a.click();
}

function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({
        orientation: 'p',
        unit: 'mm',
        format: 'a4'
    });

    const pageWidth = doc.internal.pageSize.getWidth();
    
    // Theme Colors
    const primaryColor = [46, 134, 222]; // #2e86de
    const textColor = [51, 51, 51];      // #333333
    const debtColor = [231, 76, 60];     // #e74c3c
    const creditColor = [46, 204, 113];  // #2ecc71

    // Header Banner
    doc.setFillColor(...primaryColor);
    doc.rect(0, 0, pageWidth, 28, 'F');

    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("Debt & Credit Report", 14, 18);

    const today = new Date().toLocaleDateString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric'
    });
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(`Generated: ${today}`, pageWidth - 14, 18, { align: 'right' });

    // Financial Totals
    let totalDebt = 0;
    let totalCredit = 0;
    transactions.forEach(t => {
        if (t.type === 'debt') totalDebt += Number(t.amount);
        else totalCredit += Number(t.amount);
    });

    // Summary Card Container
    doc.setFillColor(244, 247, 246);
    doc.roundedRect(14, 34, pageWidth - 28, 22, 3, 3, 'F');

    // Total Debt Card Block
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text("TOTAL DEBT", 25, 42);
    doc.setFontSize(14);
    doc.setTextColor(...debtColor);
    doc.text(`$${totalDebt.toFixed(2)}`, 25, 50);

    // Total Credit Card Block
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text("TOTAL CREDIT", pageWidth / 2 + 15, 42);
    doc.setFontSize(14);
    doc.setTextColor(...creditColor);
    doc.text(`$${totalCredit.toFixed(2)}`, pageWidth / 2 + 15, 50);

    // Transaction Table Format
    const tableBody = transactions.map(t => [
        t.date,
        t.name,
        t.type.toUpperCase(),
        `$${Number(t.amount).toFixed(2)}`
    ]);

    doc.autoTable({
        startY: 62,
        head: [['Date', 'Description / Name', 'Type', 'Amount']],
        body: tableBody,
        theme: 'striped',
        headStyles: {
            fillColor: primaryColor,
            textColor: [255, 255, 255],
            fontStyle: 'bold',
            fontSize: 10,
            cellPadding: 4
        },
        bodyStyles: {
            textColor: textColor,
            fontSize: 9.5,
            cellPadding: 3.5
        },
        columnStyles: {
            0: { cellWidth: 30 },
            1: { cellWidth: 'auto' },
            2: { cellWidth: 30, fontStyle: 'bold' },
            3: { cellWidth: 35, halign: 'right', fontStyle: 'bold' }
        },
        didParseCell: function(data) {
            if (data.section === 'body' && data.column.index === 2) {
                if (data.cell.raw === 'DEBT') {
                    data.cell.styles.textColor = debtColor;
                } else if (data.cell.raw === 'CREDIT') {
                    data.cell.styles.textColor = creditColor;
                }
            }
        },
        margin: { left: 14, right: 14 },
        didDrawPage: function (data) {
            const pageCount = doc.internal.getNumberOfPages();
            const pageHeight = doc.internal.pageSize.getHeight();
            
            doc.setFont("helvetica", "normal");
            doc.setFontSize(8);
            doc.setTextColor(120, 120, 120);
            
            doc.text("Designed & Developed by Intisar Muhib", 14, pageHeight - 10);
            doc.text(`Page ${data.pageNumber} of ${pageCount}`, pageWidth - 14, pageHeight - 10, { align: 'right' });
        }
    });

    doc.save(`Debt_Credit_Report_${new Date().toISOString().split('T')[0]}.pdf`);
}

// Initial Call
updateDisplay();
</script>

</body>
</html>
